<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="google-adsense-account" content="ca-pub-7501400445815822">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>anime.cutbar.in — Handcrafted UI Components</title>
  <meta name="description" content="50+ unique never-seen UI components. Loaders, buttons, switches, cards — copy and use instantly.">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7501400445815822" crossorigin="anonymous"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Space+Mono:wght@400;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#07090f;--bg2:#0d1120;--card:rgba(14,19,38,0.92);--border:rgba(80,110,220,0.16);--accent:#00f5d4;--a2:#ff2d78;--a3:#7b5cff;--txt:#dde4f8;--mute:#4a5580;--glow:rgba(0,245,212,0.12);}
    body.light{--bg:#eef1ff;--bg2:#e2e8f8;--card:rgba(255,255,255,0.94);--border:rgba(90,110,220,0.18);--accent:#0050e0;--a2:#e0005a;--a3:#6040ee;--txt:#141830;--mute:#6878aa;--glow:rgba(0,80,224,0.08);}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html{scroll-behavior:smooth;}
    body{background:var(--bg);color:var(--txt);font-family:'Rajdhani',sans-serif;min-height:100vh;overflow-x:hidden;transition:background .4s,color .4s;}
    body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,245,212,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(0,245,212,.022) 1px,transparent 1px);background-size:48px 48px;pointer-events:none;z-index:0;}
    body.light::before{background-image:linear-gradient(rgba(0,60,200,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,60,200,.03) 1px,transparent 1px);}
    .w{max-width:1100px;margin:0 auto;padding:0 14px;position:relative;z-index:1;}

    /* HEADER */
    header{position:sticky;top:0;z-index:200;background:var(--bg);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid var(--border);}
    .hdr{display:flex;justify-content:space-between;align-items:center;padding:12px 0 8px;flex-wrap:wrap;gap:8px;}
    .logo{font-family:'Orbitron',monospace;font-weight:900;font-size:clamp(15px,4vw,21px);background:linear-gradient(135deg,var(--accent),var(--a3),var(--a2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;display:flex;align-items:center;gap:9px;text-decoration:none;}
    .logo-gem{width:26px;height:26px;border-radius:7px;flex-shrink:0;background:conic-gradient(var(--accent),var(--a3),var(--a2),var(--accent));animation:spin 8s linear infinite;position:relative;}
    .logo-gem::after{content:'✦';position:absolute;inset:3px;background:var(--bg);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:12px;line-height:20px;text-align:center;-webkit-text-fill-color:var(--accent);}
    @keyframes spin{to{transform:rotate(360deg)}}
    .hbtns{display:flex;gap:6px;}
    .pill{font-family:'Space Mono',monospace;font-size:10px;padding:6px 12px;border-radius:100px;border:1px solid var(--border);background:var(--card);color:var(--mute);cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:5px;}
    .pill:hover{border-color:var(--accent);color:var(--accent);box-shadow:0 0 12px var(--glow);}
    .adstrip{display:flex;align-items:center;justify-content:center;gap:8px;padding:5px 0;font-family:'Space Mono',monospace;font-size:9px;color:var(--mute);}
    .adstrip a{color:var(--a2);text-decoration:none;}
    .adstrip a:hover{text-decoration:underline;}
    .adot{width:5px;height:5px;border-radius:50%;background:var(--a3);animation:adp 2s infinite;}
    @keyframes adp{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
    .tabs{display:flex;gap:5px;padding:8px 0 0;overflow-x:auto;scrollbar-width:none;}
    .tabs::-webkit-scrollbar{display:none;}
    .tab{font-family:'Space Mono',monospace;font-size:10px;font-weight:700;padding:6px 13px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--mute);cursor:pointer;transition:all .2s;white-space:nowrap;display:flex;align-items:center;gap:5px;}
    .tab:hover{border-color:var(--accent);color:var(--accent);}
    .tab.on{background:linear-gradient(135deg,var(--a3),var(--accent));border-color:transparent;color:#fff;box-shadow:0 4px 16px rgba(123,92,255,.3);}
    .tcnt{font-size:9px;padding:1px 5px;border-radius:100px;}
    .tab.on .tcnt{background:rgba(255,255,255,.2);color:rgba(255,255,255,.8);}
    .tab:not(.on) .tcnt{background:var(--border);color:var(--mute);}
    .glowrule{height:1px;background:linear-gradient(90deg,transparent,var(--a3),var(--accent),transparent);opacity:.3;}

    /* MAIN */
    main{padding:18px 0 60px;position:relative;z-index:1;}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(288px,1fr));gap:16px;}
    .card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;transition:transform .22s,border-color .22s,box-shadow .22s;backdrop-filter:blur(8px);}
    .card:hover{transform:translateY(-4px);border-color:rgba(123,92,255,.38);box-shadow:0 18px 48px rgba(0,0,0,.38),0 0 0 1px rgba(123,92,255,.1);}
    .chead{display:flex;justify-content:space-between;align-items:center;padding:11px 14px 9px;border-bottom:1px solid var(--border);}
    .cname{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:13px;letter-spacing:.3px;color:var(--txt);}
    .cbtn{font-family:'Space Mono',monospace;font-size:9px;padding:4px 11px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--mute);cursor:pointer;transition:all .18s;}
    .cbtn:hover{border-color:var(--accent);color:var(--accent);background:var(--glow);}
    .cbtn:active{transform:scale(.9);}
    .cprev{min-height:110px;display:flex;align-items:center;justify-content:center;padding:20px 14px;background:rgba(0,0,0,.16);position:relative;overflow:hidden;}
    body.light .cprev{background:rgba(80,100,200,.05);}

    /* AD SLOT — fixed height, no blank explosion */
    .adslot{margin:14px 0;text-align:center;overflow:hidden;border-radius:10px;min-height:0;}

    #loadMoreBtn{font-family:'Space Mono',monospace;font-size:11px;padding:11px 30px;border-radius:100px;border:1px solid var(--a3);background:transparent;color:var(--a3);cursor:pointer;transition:all .22s;letter-spacing:1px;display:none;}
    #loadMoreBtn:hover{background:var(--a3);color:#fff;box-shadow:0 0 20px rgba(123,92,255,.4);}
    #toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(70px);background:linear-gradient(135deg,var(--a3),var(--accent));color:#fff;padding:9px 22px;border-radius:100px;font-family:'Space Mono',monospace;font-size:11px;z-index:999;transition:transform .28s cubic-bezier(.34,1.56,.64,1);box-shadow:0 8px 24px rgba(0,0,0,.3);}
    #toast.show{transform:translateX(-50%) translateY(0);}
    footer{border-top:1px solid var(--border);padding:20px 0;text-align:center;font-family:'Space Mono',monospace;font-size:9px;color:var(--mute);position:relative;z-index:1;}
    footer a{color:var(--accent);text-decoration:none;}
    ::-webkit-scrollbar{width:5px;height:5px;}
    ::-webkit-scrollbar-track{background:var(--bg);}
    ::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px;}
    @media(max-width:480px){.grid{grid-template-columns:1fr;}}
  </style>
</head>
<body>
<div id="toast">✓ Copied!</div>
<header>
  <div class="w">
    <div class="hdr">
      <a class="logo" href="/"><div class="logo-gem"></div>anime.cutbar.in</a>
      <div class="hbtns">
        <button id="shuffleBtn" class="pill">⇄ Shuffle</button>
        <button id="themeBtn" class="pill">◑ Theme</button>
      </div>
    </div>
    <div class="adstrip"><div class="adot"></div>PREMIUM AD SPACE — <a href="mailto:ads@anime.cutbar.in">ads@anime.cutbar.in</a><div class="adot"></div></div>
    <div class="tabs" id="tabs"></div>
  </div>
  <div class="glowrule"></div>
</header>

<main>
  <div class="w">
    <div class="adslot">
      <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-7501400445815822" data-ad-slot="auto" data-ad-format="auto" data-full-width-responsive="true"></ins>
      <script>(adsbygoogle=window.adsbygoogle||[]).push({});</script>
    </div>
    <div id="root" class="grid"></div>
    <div style="text-align:center;margin-top:28px"><button id="loadMoreBtn">[ LOAD MORE ]</button></div>
    <div class="adslot" style="margin-top:36px">
      <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-7501400445815822" data-ad-slot="auto" data-ad-format="auto" data-full-width-responsive="true"></ins>
      <script>(adsbygoogle=window.adsbygoogle||[]).push({});</script>
    </div>
  </div>
</main>

<footer><div class="w">&copy; 2026 <a href="https://anime.cutbar.in">anime.cutbar.in</a> — handcrafted UI by iBneRasool &nbsp;|&nbsp; Free to copy. Impossible to forget.</div></footer>

<script src="components.js"></script>
<script>
/* ── SAFE SCRIPT EXECUTOR ─────────────────────────────── */
/* scripts inside innerHTML don't run — we extract and exec them */
function execScripts(container){
  container.querySelectorAll('script').forEach(old=>{
    const s=document.createElement('script');
    s.textContent=old.textContent;
    old.parentNode.replaceChild(s,old);
  });
}

/* ── STATE ───────────────────────────────────────────── */
let cat=null,page=1,perPage=9;
let all={},order=[];

/* ── RENDER TABS ─────────────────────────────────────── */
function renderTabs(){
  const c=document.getElementById('tabs');
  if(!c)return;
  c.innerHTML='';
  order.forEach(k=>{
    const b=document.createElement('button');
    b.className='tab'+(cat===k?' on':'');
    b.innerHTML=k+'<span class="tcnt">'+(all[k]?.length||0)+'</span>';
    b.onclick=()=>switchCat(k);
    c.appendChild(b);
  });
}

/* ── SWITCH CATEGORY ─────────────────────────────────── */
function switchCat(k){cat=k;page=1;renderTabs();render(false);}

/* ── RENDER COMPONENTS ───────────────────────────────── */
function render(append){
  const comps=all[cat]||[];
  const start=(page-1)*perPage;
  const slice=comps.slice(start,start+perPage);
  const root=document.getElementById('root');
  if(!root)return;
  if(!append)root.innerHTML='';
  slice.forEach(comp=>{
    const card=document.createElement('div');
    card.className='card';
    card.innerHTML=`
      <div class="chead">
        <span class="cname">${esc(comp.name)}</span>
        <button class="cbtn" data-s="${comp.snippetId}">Copy</button>
      </div>
      <div class="cprev">${comp.demo}</div>`;
    root.appendChild(card);
    /* execute any scripts inside this card's preview */
    execScripts(card.querySelector('.cprev'));
  });
  const lb=document.getElementById('loadMoreBtn');
  if(lb){
    lb.style.display=start+perPage<comps.length?'inline-block':'none';
    lb.onclick=()=>{page++;render(true);};
  }
  bindCopy();
}

/* ── COPY ────────────────────────────────────────────── */
function bindCopy(){
  document.querySelectorAll('.cbtn').forEach(b=>{
    b.onclick=function(){
      const s=window.snippetsMap?.[this.getAttribute('data-s')];
      if(s)navigator.clipboard.writeText(s).then(toast).catch(()=>{});
    };
  });
}
function toast(){
  const t=document.getElementById('toast');
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}
function esc(s){return String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));}

/* ── SHUFFLE ─────────────────────────────────────────── */
document.getElementById('shuffleBtn')?.addEventListener('click',()=>{
  const arr=all[cat];
  if(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}page=1;render(false);}
});

/* ── THEME ───────────────────────────────────────────── */
if(localStorage.getItem('theme')==='light')document.body.classList.add('light');
document.getElementById('themeBtn')?.addEventListener('click',()=>{
  document.body.classList.toggle('light');
  localStorage.setItem('theme',document.body.classList.contains('light')?'light':'dark');
});

/* ── INIT ────────────────────────────────────────────── */
function init(){
  if(window.componentsList&&Object.keys(window.componentsList).length){
    all=window.componentsList;order=Object.keys(all);
    if(order.length)switchCat(order[0]);
  }else{setTimeout(init,80);}
}
init();
</script>
</body>
</html>
