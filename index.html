<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="google-adsense-account" content="ca-pub-7501400445815822">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>anime.cutbar.in — Handcrafted UI Components</title>
  <meta name="description" content="Unique, never-seen UI components. Loaders, buttons, switches — handcrafted with love. Copy and use instantly.">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7501400445815822" crossorigin="anonymous"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Rajdhani:wght@500;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #080b14;
      --bg2: #0d1120;
      --card: rgba(15,20,40,0.85);
      --border: rgba(80,100,200,0.18);
      --accent: #00f5d4;
      --accent2: #ff2d78;
      --accent3: #7b5cff;
      --text: #e2e8f8;
      --muted: #556080;
      --glow: rgba(0,245,212,0.12);
    }
    body.light {
      --bg: #f0f4ff;
      --bg2: #e4eaf8;
      --card: rgba(255,255,255,0.92);
      --border: rgba(100,120,220,0.2);
      --accent: #0055ee;
      --accent2: #ff2d78;
      --accent3: #7b5cff;
      --text: #1a2040;
      --muted: #7080aa;
      --glow: rgba(0,85,238,0.08);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      font-size: 16px;
      line-height: 1.6;
      min-height: 100vh;
      transition: background 0.4s, color 0.4s;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,245,212,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,245,212,0.025) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
      z-index: 0;
    }
    body.light::before {
      background-image:
        linear-gradient(rgba(0,85,238,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,85,238,0.035) 1px, transparent 1px);
    }

    .wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; position: relative; z-index: 1; }

    /* ===== HEADER ===== */
    header {
      position: sticky; top: 0; z-index: 100;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
    }
    .header-inner {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 0 10px; flex-wrap: wrap; gap: 10px;
    }

    .logo {
      font-family: 'Orbitron', monospace;
      font-weight: 900;
      font-size: clamp(16px, 4vw, 22px);
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent3) 50%, var(--accent2) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      display: flex; align-items: center; gap: 10px;
      text-decoration: none;
    }
    .logo-gem {
      width: 28px; height: 28px; border-radius: 7px; flex-shrink: 0;
      background: conic-gradient(var(--accent), var(--accent3), var(--accent2), var(--accent));
      animation: gemSpin 8s linear infinite;
      position: relative;
    }
    .logo-gem::after {
      content: '✦';
      position: absolute; inset: 3px;
      background: var(--bg); border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; line-height: 22px; text-align: center;
      -webkit-text-fill-color: var(--accent);
    }
    @keyframes gemSpin { to { transform: rotate(360deg); } }

    .header-btns { display: flex; gap: 6px; }
    .pill {
      font-family: 'Space Mono', monospace; font-size: 10px;
      padding: 7px 13px; border-radius: 100px;
      border: 1px solid var(--border); background: var(--card);
      color: var(--muted); cursor: pointer; transition: all 0.2s;
      display: flex; align-items: center; gap: 5px;
    }
    .pill:hover { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 12px var(--glow); }

    /* Ad strip */
    .ad-strip {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 7px 0;
      font-family: 'Space Mono', monospace; font-size: 10px; color: var(--muted);
    }
    .ad-strip a { color: var(--accent2); text-decoration: none; }
    .ad-strip a:hover { text-decoration: underline; }
    .ad-pulse {
      width: 5px; height: 5px; border-radius: 50%; background: var(--accent3);
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:0.4; transform:scale(0.7); } }

    /* Glow rule */
    .glow-rule {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent3), var(--accent), transparent);
      opacity: 0.3;
    }

    /* Tabs */
    .tabs { display: flex; gap: 5px; padding: 10px 0 0; overflow-x: auto; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab-btn {
      font-family: 'Space Mono', monospace; font-size: 10px; font-weight: 700;
      padding: 6px 14px; border-radius: 8px; border: 1px solid var(--border);
      background: transparent; color: var(--muted); cursor: pointer; transition: all 0.2s;
      white-space: nowrap; letter-spacing: 0.5px; display: flex; align-items: center; gap: 6px;
    }
    .tab-btn:hover { border-color: var(--accent); color: var(--accent); }
    .tab-btn.on {
      background: linear-gradient(135deg, var(--accent3), var(--accent));
      border-color: transparent; color: #fff;
      box-shadow: 0 4px 16px rgba(123,92,255,0.3);
    }
    .tab-count {
      font-size: 9px; padding: 1px 6px; border-radius: 100px;
      background: rgba(255,255,255,0.15); color: rgba(255,255,255,0.7);
    }
    .tab-btn:not(.on) .tab-count { background: var(--border); color: var(--muted); }

    /* ===== MAIN ===== */
    main { padding: 24px 0 60px; position: relative; z-index: 1; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 18px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      transition: transform 0.22s, border-color 0.22s, box-shadow 0.22s;
      backdrop-filter: blur(8px);
    }
    .card:hover {
      transform: translateY(-5px);
      border-color: rgba(123,92,255,0.4);
      box-shadow: 0 20px 50px rgba(0,0,0,0.4), 0 0 0 1px rgba(123,92,255,0.1);
    }
    .card-head {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 14px 10px;
      border-bottom: 1px solid var(--border);
    }
    .card-name {
      font-family: 'Rajdhani', sans-serif; font-weight: 700;
      font-size: 14px; letter-spacing: 0.3px; color: var(--text);
    }
    .copy-btn {
      font-family: 'Space Mono', monospace; font-size: 9px;
      padding: 4px 11px; border-radius: 6px;
      border: 1px solid var(--border); background: transparent;
      color: var(--muted); cursor: pointer; transition: all 0.18s;
    }
    .copy-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--glow); }
    .copy-btn:active { transform: scale(0.92); }

    .card-preview {
      min-height: 120px; display: flex; align-items: center;
      justify-content: center; padding: 24px 16px;
      background: rgba(0,0,0,0.18);
    }
    body.light .card-preview { background: rgba(100,120,200,0.06); }

    /* Load more */
    #loadMoreBtn {
      font-family: 'Space Mono', monospace; font-size: 11px;
      padding: 11px 30px; border-radius: 100px;
      border: 1px solid var(--accent3); background: transparent;
      color: var(--accent3); cursor: pointer; transition: all 0.22s; letter-spacing: 1px;
    }
    #loadMoreBtn:hover { background: var(--accent3); color: #fff; box-shadow: 0 0 20px rgba(123,92,255,0.4); }

    /* Toast */
    #toast {
      position: fixed; bottom: 20px; left: 50%;
      transform: translateX(-50%) translateY(60px);
      background: linear-gradient(135deg, var(--accent3), var(--accent));
      color: #fff; padding: 9px 22px; border-radius: 100px;
      font-family: 'Space Mono', monospace; font-size: 11px;
      z-index: 999; transition: transform 0.28s cubic-bezier(0.34,1.56,0.64,1);
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    #toast.show { transform: translateX(-50%) translateY(0); }

    /* Adsense */
    .ad-slot { margin: 22px 0; text-align: center; min-height: 80px; border-radius: 10px; overflow: hidden; }

    footer {
      border-top: 1px solid var(--border); padding: 22px 0;
      text-align: center; font-family: 'Space Mono', monospace;
      font-size: 10px; color: var(--muted); position: relative; z-index: 1;
    }
    footer a { color: var(--accent); text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

    @media (max-width: 500px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div id="toast">✓ Copied!</div>

  <header>
    <div class="wrap">
      <div class="header-inner">
        <a class="logo" href="/">
          <div class="logo-gem"></div>
          anime.cutbar.in
        </a>
        <div class="header-btns">
          <button id="randomizeBtn" class="pill">⇄ Shuffle</button>
          <button id="themeToggle" class="pill">◑ Theme</button>
        </div>
      </div>
      <div class="ad-strip">
        <div class="ad-pulse"></div>
        PREMIUM AD SPACE &mdash; <a href="mailto:ads@anime.cutbar.in">ads@anime.cutbar.in</a>
        <div class="ad-pulse"></div>
      </div>
      <div class="tabs" id="categoryTabs"></div>
    </div>
    <div class="glow-rule"></div>
  </header>

  <main>
    <div class="wrap">
      <div class="ad-slot">
        <ins class="adsbygoogle" style="display:block"
          data-ad-client="ca-pub-7501400445815822"
          data-ad-slot="auto" data-ad-format="auto"
          data-full-width-responsive="true"></ins>
        <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
      </div>

      <div id="componentsRoot" class="grid"></div>

      <div style="text-align:center;margin-top:30px">
        <button id="loadMoreBtn" style="display:none">[ LOAD MORE ]</button>
      </div>

      <div class="ad-slot" style="margin-top:40px">
        <ins class="adsbygoogle" style="display:block"
          data-ad-client="ca-pub-7501400445815822"
          data-ad-slot="auto" data-ad-format="auto"
          data-full-width-responsive="true"></ins>
        <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
      </div>
    </div>
  </main>

  <footer>
    <div class="wrap">
      &copy; 2026 <a href="https://anime.cutbar.in">anime.cutbar.in</a> &mdash; handcrafted UI magic by iBneRasool<br>
      <span style="margin-top:5px;display:block;opacity:0.6">Free to copy. Impossible to forget.</span>
    </div>
  </footer>

  <script src="components.js"></script>
  <script>
    let currentCategory = null, currentPage = 1, perPage = 9;
    let allComps = {}, catOrder = [];

    function renderTabs() {
      const c = document.getElementById('categoryTabs');
      if (!c) return;
      c.innerHTML = '';
      catOrder.forEach(cat => {
        const b = document.createElement('button');
        b.className = 'tab-btn' + (currentCategory === cat ? ' on' : '');
        b.innerHTML = cat + `<span class="tab-count">${allComps[cat]?.length || 0}</span>`;
        b.onclick = () => switchCat(cat);
        c.appendChild(b);
      });
    }

    function switchCat(cat) {
      currentCategory = cat; currentPage = 1;
      renderTabs(); render(false);
    }

    function render(append) {
      const comps = allComps[currentCategory] || [];
      const start = (currentPage - 1) * perPage;
      const page = comps.slice(start, start + perPage);
      const root = document.getElementById('componentsRoot');
      if (!root) return;
      if (!append) root.innerHTML = '';
      page.forEach(comp => {
        const d = document.createElement('div');
        d.className = 'card';
        d.innerHTML = `
          <div class="card-head">
            <span class="card-name">${esc(comp.name)}</span>
            <button class="copy-btn" data-s="${comp.snippetId}">Copy</button>
          </div>
          <div class="card-preview">${comp.demo}</div>`;
        root.appendChild(d);
      });
      const lb = document.getElementById('loadMoreBtn');
      if (lb) {
        lb.style.display = start + perPage < comps.length ? 'inline-block' : 'none';
        lb.onclick = () => { currentPage++; render(true); };
      }
      bindCopy();
    }

    function bindCopy() {
      document.querySelectorAll('.copy-btn').forEach(b => {
        b.onclick = function() {
          const s = window.snippetsMap?.[this.getAttribute('data-s')];
          if (s) navigator.clipboard.writeText(s).then(showToast).catch(() => {});
        };
      });
    }

    function showToast() {
      const t = document.getElementById('toast');
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    function esc(s) {
      return String(s).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
    }

    document.getElementById('randomizeBtn')?.addEventListener('click', () => {
      const arr = allComps[currentCategory];
      if (arr) {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        currentPage = 1; render(false);
      }
    });

    if (localStorage.getItem('theme') === 'light') document.body.classList.add('light');
    document.getElementById('themeToggle')?.addEventListener('click', () => {
      document.body.classList.toggle('light');
      localStorage.setItem('theme', document.body.classList.contains('light') ? 'light' : 'dark');
    });

    function init() {
      if (window.componentsList && Object.keys(window.componentsList).length > 0) {
        allComps = window.componentsList;
        catOrder = Object.keys(allComps);
        if (catOrder.length) switchCat(catOrder[0]);
      } else { setTimeout(init, 80); }
    }
    init();
  </script>
</body>
</html>
