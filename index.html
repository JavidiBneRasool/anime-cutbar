<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="google-adsense-account" content="ca-pub-7501400445815822">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AnimeCutbar – UI Components</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7501400445815822" crossorigin="anonymous"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    body { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); font-family: 'Inter', sans-serif; }
    body.light { background: linear-gradient(135deg, #f5f7ff 0%, #e9eef5 100%); color: #1a1e2c; }
    .card { transition: transform 0.2s, box-shadow 0.2s; background: rgba(30,41,59,0.8); backdrop-filter: blur(8px); border-radius: 1.5rem; }
    body.light .card { background: rgba(255,255,255,0.8); }
    .card:hover { transform: translateY(-4px); box-shadow: 0 20px 25px -12px rgba(0,0,0,0.3); }
    .copy-btn:active { transform: scale(0.95); }
    .tab-active { background: #3b82f6; color: white; box-shadow: 0 4px 6px -1px rgba(59,130,246,0.3); }
  </style>
</head>
<body class="text-gray-200">
  <div class="container mx-auto px-4 py-6 max-w-6xl">
    <div class="flex justify-between items-center mb-6 flex-wrap gap-3">
      <h1 class="text-3xl font-bold bg-gradient-to-r from-pink-500 to-orange-400 bg-clip-text text-transparent">✨ anime.cutbar.in</h1>
      <div class="flex gap-3">
        <button id="randomizeBtn" class="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded-full text-sm font-medium transition flex items-center gap-2"><i class="fas fa-random"></i> Shuffle</button>
        <button id="themeToggle" class="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded-full text-sm font-medium transition"><i class="fas fa-moon"></i> Dark/Light</button>
      </div>
    </div>
    <div class="bg-gray-800/50 backdrop-blur-sm rounded-2xl p-3 text-center text-sm text-gray-400 mb-6 border border-gray-700">
      ✦ PREMIUM AD SPACE ✦ <a href="mailto:ads@anime.cutbar.in" class="text-pink-400">ads@anime.cutbar.in</a>
    </div>
    <div id="categoryTabs" class="flex flex-wrap gap-2 mb-8 border-b border-gray-700 pb-2"></div>
    <div id="componentsRoot" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    <div class="text-center mt-8"><button id="loadMoreBtn" class="bg-blue-600 hover:bg-blue-700 px-6 py-2 rounded-full text-white font-medium transition hidden">Load more</button></div>
    <footer class="text-center text-gray-500 text-sm mt-12 pt-6 border-t border-gray-800">© 2026 anime.cutbar.in — handcrafted components with love</footer>
  </div>
	<div id="app"></div>
	<script type="module">
	import * as Loaders from './anime-cutbar/components.js';
	// pick any loader
	document.getElementById("app").innerHTML = Loaders.Loader1();
        </script>
  <script src="components.js"></script>
  <script>
    let currentCategory = null, currentPage = 1, perPage = 6;
    let categoryComponents = {}, categoryOrder = [];
    function renderTabs() {
      const container = document.getElementById('categoryTabs');
      if(!container) return;
      container.innerHTML = '';
      categoryOrder.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = `px-4 py-2 rounded-full text-sm font-medium transition ${currentCategory === cat ? 'tab-active bg-blue-600 text-white' : 'bg-gray-800 hover:bg-gray-700'}`;
        btn.innerText = cat;
        btn.onclick = () => switchCategory(cat);
        container.appendChild(btn);
      });
    }
    function switchCategory(cat) {
      currentCategory = cat;
      currentPage = 1;
      renderTabs();
      renderComponents();
    }
    function renderComponents() {
      const comps = categoryComponents[currentCategory] || [];
      const start = (currentPage-1)*perPage;
      const paginated = comps.slice(start, start+perPage);
      const root = document.getElementById('componentsRoot');
      if(!root) return;
      root.innerHTML = paginated.map(comp => `
        <div class="card p-5 border border-gray-700 rounded-2xl">
          <div class="flex justify-between items-start mb-3">
            <h3 class="text-lg font-semibold">${escapeHtml(comp.name)}</h3>
            <button class="copy-btn bg-gray-700 hover:bg-blue-600 text-xs px-3 py-1 rounded-full transition" data-snippet="${comp.snippetId}">Copy</button>
          </div>
          <div class="bg-black/20 rounded-xl p-4 flex justify-center items-center min-h-[100px]">
            ${comp.demo}
          </div>
        </div>
      `).join('');
      const loadBtn = document.getElementById('loadMoreBtn');
      if (loadBtn) {
        if (start+perPage < comps.length) { loadBtn.classList.remove('hidden'); loadBtn.onclick = () => { currentPage++; renderComponents(); }; }
        else { loadBtn.classList.add('hidden'); }
      }
      attachCopyEvents();
    }
    function attachCopyEvents() {
      document.querySelectorAll('.copy-btn').forEach(btn => {
        btn.removeEventListener('click', copyHandler);
        btn.addEventListener('click', copyHandler);
      });
    }
    function copyHandler(e) {
      const id = e.currentTarget.getAttribute('data-snippet');
      const snippet = window.snippetsMap ? window.snippetsMap[id] : null;
      if (snippet) {
        navigator.clipboard.writeText(snippet);
        const toast = document.createElement('div');
        toast.innerText = '✓ Copied!';
        toast.className = 'fixed bottom-5 left-1/2 transform -translate-x-1/2 bg-blue-600 text-white px-4 py-2 rounded-full text-sm z-50 shadow-lg';
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 1500);
      }
    }
    function escapeHtml(str) { return String(str).replace(/[&<>]/g, function(m){if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }
    document.getElementById('randomizeBtn')?.addEventListener('click', () => {
      if (currentCategory && categoryComponents[currentCategory]) {
        const arr = categoryComponents[currentCategory];
        for (let i = arr.length-1; i>0; i--) { const j = Math.floor(Math.random()*(i+1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
        currentPage = 1; renderComponents();
      }
    });
    const themeToggle = document.getElementById('themeToggle');
    if (localStorage.getItem('theme') === 'light') document.body.classList.add('light');
    themeToggle?.addEventListener('click', () => {
      document.body.classList.toggle('light');
      const isLight = document.body.classList.contains('light');
      localStorage.setItem('theme', isLight ? 'light' : 'dark');
    });
    function init() {
      if (window.componentsList && Object.keys(window.componentsList).length > 0) {
        categoryComponents = window.componentsList;
        categoryOrder = Object.keys(categoryComponents);
        if (categoryOrder.length) switchCategory(categoryOrder[0]);
      } else {
        setTimeout(init, 100);
      }
    }
    init();
  </script>
</body>
</html>
